<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .score-display {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .game-canvas {
            border: 4px solid #333;
            border-radius: 10px;
            background: #f0f0f0;
            display: block;
            margin: 0 auto 20px;
            max-width: 100%;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-pause {
            background: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background: #f57c00;
            transform: translateY(-2px);
        }

        .btn-restart {
            background: #f44336;
            color: white;
        }

        .btn-restart:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .instructions {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .game-over-content h2 {
            color: #f44336;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 30px;
        }

        .mobile-controls {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mobile-btn:active {
            transform: scale(0.95);
            background: #5568d3;
        }

        .mobile-btn.up {
            grid-column: 2;
        }

        .mobile-btn.down {
            grid-column: 2;
        }

        .mobile-controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }

            .game-header h1 {
                font-size: 1.5em;
            }

            .score-display {
                font-size: 1.2em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .mobile-controls {
                display: flex;
            }

            .instructions {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🐍 贪吃蛇游戏</h1>
            <div class="score-display">得分: <span id="score">0</span></div>
        </div>

        <canvas id="gameCanvas" class="game-canvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">开始游戏</button>
            <button id="pauseBtn" class="btn btn-pause" disabled>暂停</button>
            <button id="restartBtn" class="btn btn-restart" disabled>重新开始</button>
        </div>

        <div class="mobile-controls">
            <div class="mobile-controls-grid">
                <button class="mobile-btn up" onclick="changeDirection('up')">↑</button>
                <button class="mobile-btn" onclick="changeDirection('left')">←</button>
                <button class="mobile-btn" onclick="changeDirection('down')">↓</button>
                <button class="mobile-btn" onclick="changeDirection('right')">→</button>
            </div>
        </div>

        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用方向键 ↑ ↓ ← → 控制蛇的移动</p>
            <p>吃掉食物增加得分和蛇身长度</p>
            <p>撞到墙壁或自身游戏结束</p>
        </div>
    </div>

    <div id="gameOverOverlay" class="game-over-overlay">
        <div class="game-over-content">
            <h2>游戏结束!</h2>
            <div class="final-score">最终得分: <span id="finalScore">0</span></div>
            <button id="playAgainBtn" class="btn btn-start">再玩一次</button>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            canvasSize: 400,
            gridSize: 20,
            initialSpeed: 150,
            speedIncrease: 2,
            minSpeed: 50,
            colors: {
                snakeHead: '#4CAF50',
                snakeBody: '#8BC34A',
                food: '#f44336',
                grid: '#e0e0e0'
            }
        };

        // ==================== 游戏状态 ====================
        let gameState = {
            snake: [],
            direction: 'right',
            nextDirection: 'right',
            food: { x: 0, y: 0 },
            score: 0,
            gameLoop: null,
            isRunning: false,
            isPaused: false,
            speed: CONFIG.initialSpeed
        };

        // ==================== DOM元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // ==================== 游戏初始化 ====================
        function initGame() {
            // 初始化蛇的位置（在画布中央）
            const startX = Math.floor(CONFIG.canvasSize / CONFIG.gridSize / 2);
            const startY = Math.floor(CONFIG.canvasSize / CONFIG.gridSize / 2);
            
            gameState.snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            
            gameState.direction = 'right';
            gameState.nextDirection = 'right';
            gameState.score = 0;
            gameState.speed = CONFIG.initialSpeed;
            gameState.isRunning = false;
            gameState.isPaused = false;
            
            updateScore();
            generateFood();
            drawGame();
            updateButtonStates();
        }

        // ==================== 食物生成 ====================
        function generateFood() {
            let newFood;
            let isValidPosition;
            
            do {
                isValidPosition = true;
                newFood = {
                    x: Math.floor(Math.random() * (CONFIG.canvasSize / CONFIG.gridSize)),
                    y: Math.floor(Math.random() * (CONFIG.canvasSize / CONFIG.gridSize))
                };
                
                // 确保食物不会生成在蛇身上
                for (let segment of gameState.snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        isValidPosition = false;
                        break;
                    }
                }
            } while (!isValidPosition);
            
            gameState.food = newFood;
        }

        // ==================== 游戏绘制 ====================
        function drawGame() {
            // 清空画布
            ctx.clearRect(0, 0, CONFIG.canvasSize, CONFIG.canvasSize);
            
            // 绘制网格背景
            drawGrid();
            
            // 绘制食物
            drawFood();
            
            // 绘制蛇
            drawSnake();
        }

        function drawGrid() {
            ctx.strokeStyle = CONFIG.colors.grid;
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= CONFIG.canvasSize; i += CONFIG.gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CONFIG.canvasSize);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CONFIG.canvasSize, i);
                ctx.stroke();
            }
        }

        function drawSnake() {
            gameState.snake.forEach((segment, index) => {
                const x = segment.x * CONFIG.gridSize;
                const y = segment.y * CONFIG.gridSize;
                
                // 蛇头和蛇身使用不同颜色
                ctx.fillStyle = index === 0 ? CONFIG.colors.snakeHead : CONFIG.colors.snakeBody;
                
                // 绘制圆角矩形
                const radius = 4;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CONFIG.gridSize - 2, CONFIG.gridSize - 2, radius);
                ctx.fill();
                
                // 为蛇头添加眼睛
                if (index === 0) {
                    drawSnakeEyes(x, y);
                }
            });
        }

        function drawSnakeEyes(x, y) {
            ctx.fillStyle = 'white';
            const eyeSize = 3;
            const eyeOffset = 5;
            
            let eye1X, eye1Y, eye2X, eye2Y;
            
            switch (gameState.direction) {
                case 'right':
                    eye1X = x + CONFIG.gridSize - eyeOffset;
                    eye1Y = y + eyeOffset;
                    eye2X = x + CONFIG.gridSize - eyeOffset;
                    eye2Y = y + CONFIG.gridSize - eyeOffset;
                    break;
                case 'left':
                    eye1X = x + eyeOffset;
                    eye1Y = y + eyeOffset;
                    eye2X = x + eyeOffset;
                    eye2Y = y + CONFIG.gridSize - eyeOffset;
                    break;
                case 'up':
                    eye1X = x + eyeOffset;
                    eye1Y = y + eyeOffset;
                    eye2X = x + CONFIG.gridSize - eyeOffset;
                    eye2Y = y + eyeOffset;
                    break;
                case 'down':
                    eye1X = x + eyeOffset;
                    eye1Y = y + CONFIG.gridSize - eyeOffset;
                    eye2X = x + CONFIG.gridSize - eyeOffset;
                    eye2Y = y + CONFIG.gridSize - eyeOffset;
                    break;
            }
            
            ctx.beginPath();
            ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFood() {
            const x = gameState.food.x * CONFIG.gridSize;
            const y = gameState.food.y * CONFIG.gridSize;
            
            // 绘制圆形食物
            ctx.fillStyle = CONFIG.colors.food;
            ctx.beginPath();
            ctx.arc(
                x + CONFIG.gridSize / 2,
                y + CONFIG.gridSize / 2,
                CONFIG.gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 添加高光效果
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(
                x + CONFIG.gridSize / 2 - 3,
                y + CONFIG.gridSize / 2 - 3,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // ==================== 蛇的移动逻辑 ====================
        function moveSnake() {
            // 更新方向
            gameState.direction = gameState.nextDirection;
            
            // 计算新的头部位置
            const head = { ...gameState.snake[0] };
            
            switch (gameState.direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }
            
            // 检查碰撞
            if (checkCollision(head)) {
                gameOver();
                return;
            }
            
            // 将新头部添加到蛇身前面
            gameState.snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                // 吃到食物：增加得分，生成新食物，不移除尾部
                gameState.score += 10;
                updateScore();
                generateFood();
                
                // 增加游戏速度
                increaseSpeed();
            } else {
                // 没吃到食物：移除尾部
                gameState.snake.pop();
            }
            
            drawGame();
        }

        // ==================== 碰撞检测 ====================
        function checkCollision(head) {
            // 检查边界碰撞
            const maxX = CONFIG.canvasSize / CONFIG.gridSize - 1;
            const maxY = CONFIG.canvasSize / CONFIG.gridSize - 1;
            
            if (head.x < 0 || head.x > maxX || head.y < 0 || head.y > maxY) {
                return true;
            }
            
            // 检查自身碰撞（从第二个身体段开始检查）
            for (let i = 1; i < gameState.snake.length; i++) {
                if (head.x === gameState.snake[i].x && head.y === gameState.snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        // ==================== 得分计算 ====================
        function updateScore() {
            scoreElement.textContent = gameState.score;
        }

        function increaseSpeed() {
            // 每吃一个食物，速度增加，但有最小值限制
            gameState.speed = Math.max(CONFIG.minSpeed, gameState.speed - CONFIG.speedIncrease);
            
            // 重新设置游戏循环以使用新速度
            if (gameState.isRunning && !gameState.isPaused) {
                clearInterval(gameState.gameLoop);
                gameState.gameLoop = setInterval(moveSnake, gameState.speed);
            }
        }

        // ==================== 方向控制 ====================
        function changeDirection(newDirection) {
            if (!gameState.isRunning || gameState.isPaused) {
                return;
            }
            
            // 防止反向移动（蛇不能直接掉头）
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            
            if (opposites[newDirection] !== gameState.direction) {
                gameState.nextDirection = newDirection;
            }
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            if (gameState.isRunning) {
                return;
            }
            
            gameState.isRunning = true;
            gameState.isPaused = false;
            
            gameState.gameLoop = setInterval(moveSnake, gameState.speed);
            updateButtonStates();
        }

        function pauseGame() {
            if (!gameState.isRunning || gameState.isPaused) {
                return;
            }
            
            gameState.isPaused = true;
            clearInterval(gameState.gameLoop);
            updateButtonStates();
        }

        function resumeGame() {
            if (!gameState.isRunning || !gameState.isPaused) {
                return;
            }
            
            gameState.isPaused = false;
            gameState.gameLoop = setInterval(moveSnake, gameState.speed);
            updateButtonStates();
        }

        function restartGame() {
            clearInterval(gameState.gameLoop);
            initGame();
            startGame();
        }

        function gameOver() {
            clearInterval(gameState.gameLoop);
            gameState.isRunning = false;
            gameState.isPaused = false;
            
            // 显示游戏结束界面
            finalScoreElement.textContent = gameState.score;
            gameOverOverlay.style.display = 'flex';
            
            updateButtonStates();
        }

        function hideGameOver() {
            gameOverOverlay.style.display = 'none';
        }

        // ==================== 按钮状态更新 ====================
        function updateButtonStates() {
            startBtn.disabled = gameState.isRunning;
            pauseBtn.disabled = !gameState.isRunning;
            restartBtn.disabled = !gameState.isRunning && gameState.score === 0;
            
            if (gameState.isPaused) {
                pauseBtn.textContent = '继续';
            } else {
                pauseBtn.textContent = '暂停';
            }
        }

        // ==================== 事件监听 ====================
        // 键盘控制
        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    changeDirection('right');
                    break;
                case ' ':
                    event.preventDefault();
                    if (gameState.isPaused) {
                        resumeGame();
                    } else if (!gameState.isRunning) {
                        startGame();
                    } else {
                        pauseGame();
                    }
                    break;
            }
        });

        // 按钮事件
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', () => {
            if (gameState.isPaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        });
        restartBtn.addEventListener('click', restartGame);
        playAgainBtn.addEventListener('click', () => {
            hideGameOver();
            restartGame();
        });

        // ==================== 响应式画布 ====================
        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const maxWidth = Math.min(400, window.innerWidth - 100);
            
            if (maxWidth < 400) {
                const scale = maxWidth / 400;
                canvas.style.width = maxWidth + 'px';
                canvas.style.height = maxWidth + 'px';
            } else {
                canvas.style.width = '400px';
                canvas.style.height = '400px';
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // ==================== 游戏启动 ====================
        // 初始化游戏
        initGame();
        resizeCanvas();
    </script>
</body>
</html>
